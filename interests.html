<!doctype html>
<html lang="en">
  <head>
    <title>Interests and Hobbies</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>

    <!-- Theme Switch -->
    <div class="card mx-auto" style="max-width: 150px">
      <div class="row">
        <div class="col-sm-9 border-end">
          <div class="mode-switch">
            <button
              title="Use dark mode"
              id="dark"
              class="btn btn-sm btn-default text-secondary"
            >
              <i class="bi bi-moon"></i>
            </button>
            <button
              title="Use light mode"
              id="light"
              class="btn btn-sm btn-default text-secondary"
            >
              <i class="bi bi-sun"></i>
            </button>
            <button
              title="Use system preferred mode"
              id="system"
              class="btn btn-sm btn-default text-secondary"
            >
              <i class="bi bi-display"></i>
            </button>
          </div>
        </div>
        <div class="col-sm-3 g-0">
          <a
            class="btn btn-sm btn-default text-primary"
            href="https://albertoroura.com/building-a-theme-switcher-for-bootstrap/"
            target="_blank"
            ><i class="bi bi-question-square"></i
          ></a>
        </div>
      </div>
    </div>

    <!-- About me + Intro -->
    <div class="container">
      <!--First info goes here-->
    </div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>

    <!-- Script for theme toggle -->
    <!-- Credit: "https://albertoroura.com/building-a-theme-switcher-for-bootstrap/" -->
    <script>
      function setTheme(mode = "auto") {
        const userMode = localStorage.getItem("bs-theme");
        const sysMode = window.matchMedia(
          "(prefers-color-scheme: light)",
        ).matches;
        const useSystem = mode === "system" || (!userMode && mode === "auto");
        const modeChosen = useSystem
          ? "system"
          : mode === "dark" || mode === "light"
            ? mode
            : userMode;

        if (useSystem) {
          localStorage.removeItem("bs-theme");
        } else {
          localStorage.setItem("bs-theme", modeChosen);
        }

        document.documentElement.setAttribute(
          "data-bs-theme",
          useSystem ? (sysMode ? "light" : "dark") : modeChosen,
        );
        document
          .querySelectorAll(".mode-switch .btn")
          .forEach((e) => e.classList.remove("text-body"));
        document.getElementById(modeChosen).classList.add("text-body");
      }

      setTheme();
      document
        .querySelectorAll(".mode-switch .btn")
        .forEach((e) => e.addEventListener("click", () => setTheme(e.id)));
      window
        .matchMedia("(prefers-color-scheme: light)")
        .addEventListener("change", () => setTheme());
    </script>
  </body>
</html>
