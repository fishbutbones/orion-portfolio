<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <title>Projects</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>

    <!-- Projects -->
    <div class="container my-5">
      <div class="my-4 p-3 card rounded text-center">
        <h1>Projects</h1>
      </div>
      <div class="card">
        <div class="card-header"><h2>Computer Science and Web Design</h2></div>
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-8">
              <div class="card-body">
                <h4 class="text-center card-title">Web Starter Project</h4>
              </div>
            </div>
            <div class="col-sm-4">
              <!-- Carousel -->
              <div id="demo" class="carousel slide" data-bs-ride="carousel">
                <!-- Indicators/dots -->
                <div class="carousel-indicators">
                  <button
                    type="button"
                    data-bs-target="#demo"
                    data-bs-slide-to="0"
                    class="active"
                  ></button>
                  <button
                    type="button"
                    data-bs-target="#demo"
                    data-bs-slide-to="1"
                  ></button>
                  <button
                    type="button"
                    data-bs-target="#demo"
                    data-bs-slide-to="2"
                  ></button>
                </div>

                <!-- The slideshow/carousel -->
                <div class="carousel-inner">
                  <div class="carousel-item active">
                    <img
                      src="images/BANANA.png"
                      alt="Banana Demo Image"
                      class="d-block"
                      style="width: 100%"
                    />
                  </div>
                  <div class="carousel-item">
                    <img
                      src="images/APPLE.png"
                      alt="Apple Demo Image"
                      class="d-block"
                      style="width: 100%"
                    />
                  </div>
                  <div class="carousel-item">
                    <img
                      src="images/ORANGE.png"
                      alt="Orange Demo Image"
                      class="d-block"
                      style="width: 100%"
                    />
                  </div>
                </div>

                <!-- Left and right controls/icons -->
                <button
                  class="carousel-control-prev"
                  type="button"
                  data-bs-target="#demo"
                  data-bs-slide="prev"
                >
                  <span class="carousel-control-prev-icon"></span>
                </button>
                <button
                  class="carousel-control-next"
                  type="button"
                  data-bs-target="#demo"
                  data-bs-slide="next"
                >
                  <span class="carousel-control-next-icon"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
